services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: sdv-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sdv
      # POSTGRES_USER는 컨테이너 초기화 시 undemotable bootstrap superuser가 된다.
      # 이 값을 런타임 역할(sdv)로 바꾸면 sdv가 superuser가 되어 최소 권한 요구사항과
      # 충돌하므로 sdv_user로 유지한다. 제한된 런타임 역할 sdv는
      # infra/initdb/10-create-runtime-role.sh가 별도로 생성한다.
      POSTGRES_USER: sdv_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    ports:
      - "5432:5432"

    volumes:
      - sdv-postgres-data:/var/lib/postgresql
      # 최초(빈 데이터 디렉터리) 기동 시에만 실행된다. 이미 데이터가 있는 볼륨에는
      # 자동으로 재실행되지 않는다 - infra/secrets/README.md의 복구 절차 참고.
      - ./initdb:/docker-entrypoint-initdb.d:ro

    secrets:
      - postgres_password
      - sdv_runtime_password

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdv_user -d sdv"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:4.3.1
    container_name: sdv-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    volumes:
      - sdv-kafka-data:/var/lib/kafka/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: sdv-keycloak
    restart: unless-stopped

    # --import-realm은 데이터 디렉터리가 비어 있는(fresh) 최초 기동에만 realm을
    # 실제로 만든다. 이미 realm "sdv"가 존재하는 기존 sdv-keycloak-data 볼륨에는
    # 이 realm을 다시 Import하거나 덮어쓰지 않는다(Keycloak 자체 동작) - 기존 로컬
    # 상태를 보존한다.
    command: start-dev --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "8180:8080"

    volumes:
      - sdv-keycloak-data:/opt/keycloak/data
      # F-INF-006. Secret 없는 최소 로컬 realm baseline(No user/password/client
      # secret) - fresh 볼륨에서만 Import된다(위 커맨트 참고).
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
volumes:
  sdv-postgres-data:
  sdv-kafka-data:
  sdv-keycloak-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  sdv_runtime_password:
    file: ./secrets/sdv_runtime_password.txt