spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sdv}
    username: ${DB_USERNAME:sdv_user}
    password: ${DB_PASSWORD:sdv_password}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

sdv:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sdv}
    audience: ${KEYCLOAK_AUDIENCE:sdv-backend}

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}