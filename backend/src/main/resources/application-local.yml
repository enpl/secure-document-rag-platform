spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sdv}
    username: ${SPRING_DATASOURCE_USERNAME:sdv}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # sdv_user는 기존 bootstrap 관리자이자 로컬 Flyway Migration 식별자로 유지된다.
  # 런타임 애플리케이션 커넥션(spring.datasource)과는 별도 자격증명이다.
  # NOTE: 이는 로컬 개발 한정 타협이다 - 애플리케이션 프로세스가 자신의 설정/메모리 안에
  # sdv_user(보존된 Bootstrap Superuser - sdv보다 넓은 권한이 아니라 실제 Superuser) 자격증명을
  # 함께 들고 있게 된다.
  # 운영 환경에서는 Migration을 애플리케이션이 받지 않는 별도 프로세스/CI 단계로 분리해야 한다.
  flyway:
    user: ${SPRING_FLYWAY_USER:sdv_user}
    password: ${SPRING_FLYWAY_PASSWORD}
    locations: classpath:db/migration,classpath:db/callback

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

sdv:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sdv}
    audience: ${KEYCLOAK_AUDIENCE:sdv-backend}

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

  # M08 MVP OAuth (docs/spec/SDV_M08_TOKEN_CONTRACT.md) - SecretProperties(F-BE-128)
  # binds these. A blank value fails closed only at actual OAuth use (GoogleOAuthClient/
  # GoogleTokenService), never at application startup.
  secrets:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    google-redirect-uri: ${GOOGLE_REDIRECT_URI:}
    token-encryption-key-file: ${SOURCE_TOKEN_ENCRYPTION_KEY_FILE:}
    token-encryption-key: ${SOURCE_TOKEN_ENCRYPTION_KEY:}
    token-encryption-key-id: ${SOURCE_TOKEN_ENCRYPTION_KEY_ID:}

  # M16A - GoogleDriveOAuthController reads these two directly (@Value, no
  # SecretProperties binding - neither value is a secret). frontend-return-url is the
  # fixed route the browser is redirected back to after Google's callback (the
  # ?googleConnect=success|failed query flag is only a display hint, never proof of a
  # stored credential - the frontend still reloads GET /api/admin/sources afterward).
  # cookie-secure defaults to false only on this local profile - the OAuth binding
  # cookie is exchanged over plain http://localhost in local dev; every other profile
  # keeps the fail-safe default (true) from GoogleDriveOAuthController's own @Value default.
  google-oauth:
    frontend-return-url: ${GOOGLE_OAUTH_FRONTEND_RETURN_URL:}
    cookie-secure: ${GOOGLE_OAUTH_COOKIE_SECURE:false}