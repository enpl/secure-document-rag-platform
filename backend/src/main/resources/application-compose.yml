spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sdv}
    username: ${SPRING_DATASOURCE_USERNAME:sdv}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # application-local.yml과 동일한 이유로 sdv_user를 Flyway 식별자로 사용한다.
  flyway:
    user: ${SPRING_FLYWAY_USER:sdv_user}
    password: ${SPRING_FLYWAY_PASSWORD}
    locations: classpath:db/migration,classpath:db/callback

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

sdv:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/sdv}
    audience: ${KEYCLOAK_AUDIENCE:sdv-backend}

  ai-service:
    url: ${AI_SERVICE_URL:http://ai-service:8000}

  ollama:
    base-url: ${OLLAMA_BASE_URL:http://ollama:11434}