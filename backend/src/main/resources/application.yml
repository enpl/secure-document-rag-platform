spring:
  application:
    name: secure-document-vault
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  # M09A (F-BE-074) - OutboxEventPublisher는 Payload를 이미 위생 처리된 JSON
  # 문자열로 직렬화해 보낸다(원본 Object 직렬화 아님) - Key/Value 모두 String이면
  # 충분하다. bootstrap-servers는 Profile별 값(application-local/-compose/
  # -testbed.yml)을 그대로 쓴다 - 여기서 재정의하지 않는다.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # M11 - IndexRequestedConsumer가 쓰는 Consumer 쪽 (De)Serializer. Producer와 동일하게
    # Payload는 이미 위생 처리된 JSON 문자열이다(원본 Object 역직렬화 아님).
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8080

# F-BE-014/015(Admin Health)와는 별개로, Spring Boot 표준 Health 지원(DataSource 등)을
# 위해 Actuator를 추가한다. health 엔드포인트만 web에 노출하고 상세 정보는 감춘다 -
# 자격증명/환경변수/내부 예외 세부사항이 노출되지 않도록 한다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # M09A - spring-kafka(build.gradle)를 추가하면서 함께 딸려오는 Actuator Kafka
  # Health Indicator를 명시적으로 끈다. Kafka Auto-configuration 자체는 시작 시
  # Broker에 연결하지 않지만(F-BE-074 Javadoc 참고), Health Indicator를 켜두면
  # /actuator/health가 매 호출마다 Broker 연결을 시도해 Broker가 없는 모든 기본
  # 실행(로컬/Compose/테스트베드 - Outbox Publisher는 기본 비활성화)에서 이유 없이
  # DOWN을 보고하게 된다 - "Default 실행이 Broker 연결을 요구하지 않는다"는 이
  # Slice의 요구사항과 직접 충돌하므로 꺼둔다.
  health:
    kafka:
      enabled: false

# M09A (F-BE-074) - Outbox -> Kafka Publisher. enabled는 모든 Profile에서
# 기본 false로 고정된다(OutboxPublisherProperties 생성자가 한 번 더 강제) -
# 이 Slice는 실제 Google Drive/개인 계정에 대해 자동 발행을 시작하지 않는다.
# 격리된 Test Kafka Broker를 쓰는 테스트만 이 값을 명시적으로 true로 Override한다.
sdv:
  sync:
    outbox-publisher:
      enabled: ${SDV_OUTBOX_PUBLISHER_ENABLED:false}
      batch-size: ${SDV_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      max-attempts: ${SDV_OUTBOX_PUBLISHER_MAX_ATTEMPTS:8}
      poll-interval-ms: ${SDV_OUTBOX_PUBLISHER_POLL_INTERVAL_MS:5000}
      send-timeout-ms: ${SDV_OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:10000}
      stale-claim-seconds: ${SDV_OUTBOX_PUBLISHER_STALE_CLAIM_SECONDS:600}
      topic: ${SDV_OUTBOX_PUBLISHER_TOPIC:sdv.source.events}
    # M09A 교정(방치된 Run 복구) - 한 Sync Run에 허용되는 최대 실행 시간(Lease/Deadline)과
    # Page 수 상한. Lease가 지난 RUNNING 행은 다음 인가된 수동 Sync 요청이 회수한다(상시
    # Scheduler 없음) - SyncRunLifecycle/GoogleDriveSyncJob 참고.
    run:
      max-duration-ms: ${SDV_SYNC_RUN_MAX_DURATION_MS:1800000}
      max-pages-per-run: ${SDV_SYNC_RUN_MAX_PAGES_PER_RUN:2000}
  # M10 (RAG-011 File Metadata Discovery) - GET /api/rag/files의 Page 크기/개수
  # 상한과 Live(Google) 재검증 전체에 허용되는 벽시계 시간 예산.
  rag:
    discovery:
      default-page-size: ${SDV_RAG_DISCOVERY_DEFAULT_PAGE_SIZE:20}
      max-page-size: ${SDV_RAG_DISCOVERY_MAX_PAGE_SIZE:50}
      max-page-index: ${SDV_RAG_DISCOVERY_MAX_PAGE_INDEX:500}
      live-check-budget-ms: ${SDV_RAG_DISCOVERY_LIVE_CHECK_BUDGET_MS:10000}
      max-candidate-scan: ${SDV_RAG_DISCOVERY_MAX_CANDIDATE_SCAN:200}
    # M11 (F-BE-072/§2A.11) - IndexRequestedConsumer/IndexOrchestrator. enabled는
    # 모든 Profile에서 기본 false다 - 이 Slice는 실제 개인 Drive에 대해 자동으로
    # 색인을 시작하지 않는다. 격리된 Test Kafka Broker를 쓰는 테스트만 이 값을
    # 명시적으로 true로 Override한다(docs/runbooks/M11_INDEXING_ACTIVATION.md 참고).
    index-consumer:
      enabled: ${SDV_RAG_INDEX_CONSUMER_ENABLED:false}
      topic: ${SDV_RAG_INDEX_CONSUMER_TOPIC:sdv.source.events}
      group-id: ${SDV_RAG_INDEX_CONSUMER_GROUP_ID:sdv-rag-index-orchestrator}
      max-attempts: ${SDV_RAG_INDEX_CONSUMER_MAX_ATTEMPTS:4}
      backoff-ms: ${SDV_RAG_INDEX_CONSUMER_BACKOFF_MS:2000}
  # M10C (SHR-004): full-download response is deliberately buffered.  A slot is held until
  # servlet delivery terminates, so slow clients cannot create an unbounded buffer queue.
  shared-download:
    max-bytes: ${SDV_SHARED_DOWNLOAD_MAX_BYTES:26214400}
    max-concurrent-downloads: ${SDV_SHARED_DOWNLOAD_MAX_CONCURRENT_DOWNLOADS:2}
    request-timeout-ms: ${SDV_SHARED_DOWNLOAD_REQUEST_TIMEOUT_MS:30000}
  # M12 (F-BE-103/§2A.5 Mandatory Live Retrieval) - 요청 하나(다중 파일 포함)에
  # 허용되는 유한한 상한. index-consumer와 마찬가지로 실제 sLLM/자연어 검색이
  # 연결되기 전에는 운영 트래픽이 이 경로를 타지 않는다(격리된 테스트만 호출).
  live-retrieval:
    max-files-per-request: ${SDV_RAG_LIVE_MAX_FILES_PER_REQUEST:5}
    per-file-deadline-ms: ${SDV_RAG_LIVE_PER_FILE_DEADLINE_MS:20000}
    total-request-deadline-ms: ${SDV_RAG_LIVE_TOTAL_REQUEST_DEADLINE_MS:60000}
    max-evidence-chars: ${SDV_RAG_LIVE_MAX_EVIDENCE_CHARS:4000}
    max-top-k: ${SDV_RAG_LIVE_MAX_TOP_K:10}
    max-candidate-document-scan: ${SDV_RAG_LIVE_MAX_CANDIDATE_DOCUMENT_SCAN:500}
    max-concurrent-content-operations: ${SDV_RAG_LIVE_MAX_CONCURRENT_CONTENT_OPERATIONS:2}
    max-in-flight-content-bytes: ${SDV_RAG_LIVE_MAX_IN_FLIGHT_CONTENT_BYTES:52428800}
  # M12 (F-BE-206/208/§2A.6 Encrypted Ephemeral Evidence) - Hard TTL(최대 300초,
  # 배포 환경에서 더 짧게만 설정 가능) + Process-local 암호화 Volatile Storage 용량 상한.
  ephemeral-evidence:
    ttl-seconds: ${SDV_RAG_EPHEMERAL_EVIDENCE_TTL_SECONDS:300}
    max-entries: ${SDV_RAG_EPHEMERAL_EVIDENCE_MAX_ENTRIES:5000}
    max-bytes: ${SDV_RAG_EPHEMERAL_EVIDENCE_MAX_BYTES:16777216}
    sweep-interval-ms: ${SDV_RAG_EPHEMERAL_EVIDENCE_SWEEP_INTERVAL_MS:30000}
